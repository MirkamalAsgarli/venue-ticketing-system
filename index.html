<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theatre Tickets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="venue-name">Theatre</h1>
    <div id="legend"></div>
  </header>
  <div class="main">
    <div class="map-part">
      <div class="buttons">
        <button id="zoom-in">Zoom In</button>
        <button id="zoom-out">Zoom Out</button>
        <button id="move-up">&uarr; Up</button>
        <button id="move-down">&darr; Down</button>
        <button id="move-left">&larr; Left</button>
        <button id="move-right">&rarr; Right</button>
        <button id="reset">Reset / Center View</button>
      </div>
      <div id="viewport">
        <div id="world"></div>
      </div>
    </div>
    <div class="side">
      <div class="box">
        <h2>Seat details</h2>
        <div id="details"></div>
      </div>
      <div class="box">
        <h2>Cart</h2>
        <ul id="cart-list"></ul>
        <p class="total">Total: <strong id="total">$0</strong></p>
      </div>
    </div>
  </div>
  <script src="venue-data.js"></script>
  <script src="controls.js"></script>
</body>
</html>
